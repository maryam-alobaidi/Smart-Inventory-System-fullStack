<div class="category-container p-4">
  <div class="card shadow-sm border-0 rounded-3">
 <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
  <h5 class="mb-0 fw-bold text-primary">Category Management</h5>
  <button 
    type="button" 
    class="btn btn-primary shadow-sm" 
    data-bs-toggle="modal" 
    data-bs-target="#addCategoryModal">
    <i class="fa-solid fa-plus-circle me-2"></i>Add Category
  </button>
</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-secondary small text-uppercase fw-bold">
            <tr>
              <th class="px-4 py-3">Category ID</th>
              <th class="py-3">Category Name</th>
            </tr>
          </thead>
          <tbody>
                 @for (category of categories(); track category.categoryID) { 
                  <tr>
                <td class="px-4 py-3 fw-bold text-muted">#{{category.categoryID }}</td>
                <td class="py-3">
                  <div class="d-flex align-items-center">
                    <div class="avatar-circle me-2 bg-primary-subtle text-primary">
                       {{ category.categoryName.charAt(0).toUpperCase() }}
                    </div>
                    {{ category.categoryName }}
                  </div>
                </td>
              
              
                <td class="py-3 text-center">
 <button 
  type="button"
  (click)="onEdit(category)" 
  class="btn btn-sm btn-light text-primary me-1 shadow-sm"
  data-bs-toggle="modal" 
  data-bs-target="#editCategoryModal">
  <i class="fa-solid fa-pen"></i>
</button>

<button (click)="onDelete(category.categoryID)" class="btn btn-sm btn-light text-danger shadow-sm">
  <i class="fa-solid fa-trash"></i>
</button>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>


 <div class="modal fade" id="editCategoryModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Edit Category data</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
      <div class="modal-body">
  <div class="mb-3">
    <label class="form-lable">Category Name</label>
    <input type="text" class="form-control" [(ngModel)]="selectedCategory.categoryName" name="categoryName">
  </div>

    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="saveEdit()">Save</button>
    </div>
  </div>
</div>
</div>


<div class="modal fade" id="addCategoryModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Add Category</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
      <div class="modal-body">
  <div class="mb-3">
  <label class="form-label">Category Name</label>
  <input type="text" class="form-control" name="categoryName" placeholder="e.g.Electronic" [(ngModel)]="newCategory.categoryName">
</div>


    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="saveAdd()">Save</button>
    </div>
  </div>
</div>
</div>
</div>
