<div class="user-container p-4">
  <div class="card shadow-sm border-0 rounded-3">
 <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
  <h5 class="mb-0 fw-bold text-primary">User Management</h5>
  <button 
    type="button" 
    class="btn btn-primary shadow-sm" 
    data-bs-toggle="modal" 
    data-bs-target="#addUserModal">
    <i class="fa-solid fa-plus-circle me-2"></i>Add User
  </button>
</div>
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="bg-light text-secondary small text-uppercase fw-bold">
            <tr>
              <th class="px-4 py-3">ID</th>
              <th class="py-3">Full Name</th>
              <th class="py-3">User Role</th>
            </tr>
          </thead>
          <tbody>
                 @for (user of users(); track user.userID) { 
               <tr>
                <td class="px-4 py-3 fw-bold text-muted">#{{ user.userID }}</td>
                <td class="py-3">
                  <div class="d-flex align-items-center">
                    <div class="avatar-circle me-2 bg-primary-subtle text-primary ">
                       {{ user.username.charAt(0).toUpperCase() }}
                    </div>
                    {{ user.username }}
                  </div>
                </td>
               <td class="py-3">
                  <span class="badge rounded-pill px-3"
                     [ngClass]="{
                       'bg-danger-subtle text-danger': user.role === 'Admin',
                       'bg-primary-subtle text-primary': user.role === 'User',
                       'bg-info-subtle text-info': user.role !== 'Admin' && user.role !== 'User'
                     }">
                     {{ user.role }}
                  </span>
                </td>

                <td class="py-3 text-center">
                   <button 
                    type="button"
                    (click)="onEdit(user)" 
                    class="btn btn-sm btn-light text-primary me-1 shadow-sm"
                    data-bs-toggle="modal" 
                    data-bs-target="#editUserModal">
                    <i class="fa-solid fa-pen"></i>
                  </button>
                  
                  <button (click)="onDelete(user.userID)" class="btn btn-sm btn-light text-danger shadow-sm">
                    <i class="fa-solid fa-trash"></i>
                  </button>
              </tr>
            }
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>


<div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Edit User data</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
      <div class="modal-body">
  <div class="mb-3">
    <label class="form-lable">Username</label>
    <input type="text" class="form-control" [(ngModel)]="selectedUser.username" name="username">
  </div>
  <div class="mb-3">
    <label class="form-lable">Role</label>
    <select class="form-select" [(ngModel)]="selectedUser.role" name="role">
      <option value="Admin">Admin</option>
      <option value="User">User</option>
    </select>
  </div>
    </div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="saveEdit()">Save</button>
    </div>
  </div>
</div>
</div>


<div class="modal fade" id="addUserModal" tabindex="-1" aria-hidden="true">
<div class="modal-dialog modal-dialog-centered">
  <div class="modal-content">
    <div class="modal-header">
      <h5 class="modal-title">Add User</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
    </div>
      <div class="modal-body">
  <div class="mb-3">
  <label class="form-label">Full Name</label>
  <input type="text" class="form-control" name="username" placeholder="e.g. Maryam Al Obaidi" [(ngModel)]="newUser.username">
</div>

<div class="mb-3">
  <label class="form-label">Password</label>
  <input type="password" class="form-control" name="password" placeholder="········" [(ngModel)]="newUser.password">
</div>

<div class="mb-3">
  <label class="form-label">Role</label>
  <select class="form-select" name="role" [(ngModel)]="newUser.role">
    <option value="" disabled selected>Choose a role...</option>
    <option value="Admin">Admin</option>
    <option value="User">User</option>
  </select>
</div>

    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-primary" (click)="saveAdd()">Save</button>
    </div>
  </div>
</div>
</div>
</div>
