name: Docker Build Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build backend Docker image
        run: docker build -t inventoryapi ./SmartInventorySystemBackend

      - name: Build frontend Docker image
        run: docker build -t inventoryui ./SmartInventoryUI